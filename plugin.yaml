name: bubblewrap-yuno
label: Bubblewrap (yuno)
version: 1.5.1+yuno.3
manifest_version: 2
kind: backend
author: NousResearch (fork maintained by yunochi)
license: MIT
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/bubblewrap
description: >
  Local fork of the official bubblewrap backend, kept at
  https://github.com/NousResearch/hermes-official-plugins/tree/main/bubblewrap.
  Same sandbox as bubblewrap, plus changes for hardware work: a bind whose
  source is a device node is mounted with --dev-bind (a plain --bind lands with
  nodev set, and the kernel refuses to open a device node on a nodev mount with
  EACCES, so /dev/ttyACM0 would be visible but unusable), and auto_devices binds
  /dev/ttyACM* and /dev/ttyUSB* that exist at spawn time, and trust_operator
  (off by default) which makes paths the operator names in binds/home_allow win
  over the hidden set instead of being silently dropped. The empty file bound
  over the hidden file paths now lives in the per-user runtime dir
  (/run/user/<uid>/hermes-bwrap-empty), outside every bind a sandbox gets, so a
  writable HOME cannot be used to swap it for a link to a secret.
  Select it with `hermes config set terminal.backend bubblewrap-yuno`.
requires_hermes: ">=0.22.6"
platforms: [linux]
tags: [terminal, sandbox, bubblewrap, linux]
provides_tools: []
provides_hooks: []
capabilities: []
config_schema:
  profile:
    type: str
    default: network
    label: Profile
    description: "restricted: read-only working directory, no network. workspace: writable working directory, no network. network: writable working directory and the host network."
  trust_operator:
    type: bool
    default: false
    label: Trust operator paths
    description: "Off by default. When on, the paths named in binds and home_allow win over the hidden set: a bind inside HERMES_HOME or an allowlist entry such as .ssh is mounted/shown instead of being dropped with a warning, and no overlay hides it. This removes the sandbox's own escape protection — a read-write bind of HERMES_HOME lets a command rewrite this plugin's code and config.yaml, which runs on the host at the next spawn."
  auto_devices:
    type: bool
    default: true
    label: Auto-bind serial devices
    description: "Bind every /dev/ttyACM* and /dev/ttyUSB* present at spawn time read-write into the sandbox with --dev-bind, so a board that was plugged in after startup is usable. Already-listed binds are not duplicated."
  binds:
    type: list
    default: []
    label: Extra binds
    description: "Extra host paths to mount, as a list of {src, dest, readonly} (readonly defaults to true; dest defaults to src). Sources under a hidden path are dropped."
  memory_mb:
    type: int
    default: 256
    label: Memory limit (MB)
    description: "Address-space limit per command (RLIMIT_AS). 0 disables it."
  cpu_seconds:
    type: int
    default: 30
    label: CPU limit (seconds)
    description: "CPU time per command (RLIMIT_CPU). 0 disables it."
  max_procs:
    type: int
    default: 256
    label: Process limit
    description: "Processes and threads one command may run (RLIMIT_NPROC, counted per sandbox; needs Linux 5.14 or later, else it is not applied). 0 disables it."
  home_allow:
    type: list
    default: []
    label: Extra home entries
    description: "More dot entries of the home directory to show read-only, for example [\".zz-tool\", \".config/nvim\"]. Dot entries off the shipped allowlist are hidden; credential stores stay hidden. Under home_default_deny all it also takes top-level names such as \"projects\"."
  hide:
    type: list
    default: []
    label: Extra hidden paths
    description: "More paths to hide, absolute or relative to the home directory, for example [\"~/Documents/keys\"]."
  home_default_deny:
    type: str
    choices: [dot, all]
    default: dot
    label: Hidden home entries
    description: "dot: hide dot entries of the home directory off the allowlist. all: hide every entry off it."
